<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的 2026 复盘</title>
  <style>
    :root { --bg: #fafaf8; --text: #222; --muted: #888; --line: #e2e2dd; --accent: #2b6cb0; --code: #f0f0ec; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1a1a1a; --text: #e6e6e6; --muted: #999; --line: #333; --accent: #7ab3ef; --code: #262626; }
    }
    html { scroll-behavior: smooth; scroll-padding-top: 60px; }
    body { background: var(--bg); color: var(--text); margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; line-height: 1.8; }
    .wrap { max-width: 720px; margin: 0 auto; padding: 0 20px; }
    nav { position: sticky; top: 0; background: var(--bg); border-bottom: 1px solid var(--line); z-index: 5; }
    nav .wrap { padding-top: 10px; padding-bottom: 10px; display: flex; gap: 18px; flex-wrap: wrap; }
    nav a { color: var(--accent); text-decoration: none; }
    #content h1 { margin: 40px 0 4px; font-size: 1.8em; }
    #content h2 { margin-top: 0; padding-top: 32px; border-top: 1px solid var(--line); }
    #content h1 + p { color: var(--muted); margin-top: 0; }
    #content img { max-width: 100%; }
    #content blockquote { margin-left: 0; padding-left: 14px; border-left: 3px solid var(--line); color: var(--muted); }
    #content code { background: var(--code); padding: 2px 5px; border-radius: 3px; }
    #content a { color: var(--accent); }
    footer { color: var(--muted); font-size: 0.85em; padding: 32px 0 48px; }
  </style>
</head>
<body>
  <nav><div class="wrap" id="nav"></div></nav>
  <main class="wrap"><div id="content">加载中…</div></main>
  <footer><div class="wrap">写于 2026</div></footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script>
    // 如果第一个 CDN 加载失败，换备用 CDN
    if (!window.marked) document.write('<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"><\/script>');
  </script>
  <script>
    const box = document.getElementById('content');
    const fail = msg => { box.textContent = msg; };

    fetch('content.md?t=' + Date.now())
      .then(r => { if (!r.ok) throw new Error('读取 content.md 失败（' + r.status + '）。请确认它和 index.html 在同一目录；本地预览不能直接双击 index.html。'); return r.text(); })
      .then(md => {
        if (!window.marked) throw new Error('Markdown 渲染库没有加载成功，请检查网络后刷新。');
        // 兼容 "##工作" 这种 # 后面没有空格的写法
        md = md.replace(/^(#{1,6})(?=[^#\s])/gm, '$1 ');
        box.innerHTML = marked.parse(md);

        // 自动生成导航：每个二级标题（##）对应一个链接
        const nav = document.getElementById('nav');
        box.querySelectorAll('h2').forEach((h, i) => {
          h.id = 'sec-' + i;
          const a = document.createElement('a');
          a.href = '#sec-' + i;
          a.textContent = h.textContent;
          nav.appendChild(a);
        });
        if (!nav.children.length) nav.textContent = '（content.md 里还没有 ## 二级标题）';
        const h1 = box.querySelector('h1');
        if (h1) document.title = h1.textContent;
      })
      .catch(e => fail(e.message));
  </script>
</body>
</html>
